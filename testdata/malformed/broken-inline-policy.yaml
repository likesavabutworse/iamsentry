# Evidence fixture for the README's "A gap Helm/kubectl/ArgoCD structurally
# can't see" claim: this is schema-valid (inlinePolicies is just a string
# field, and this is a string) but the string's content is broken JSON — a
# trailing comma after the last array element. Helm/kubectl/ArgoCD would
# never notice; iamsentry's input parser rejects it as a hard error before
# either check layer runs, with no AWS dependency. See
# internal/input/scan_test.go's TestScan_MalformedJSONIsHardError.
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Role
metadata:
  name: svc-broken
spec:
  name: svc-broken
  assumeRolePolicyDocument: |
    {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"pods.eks.amazonaws.com"},"Action":"sts:AssumeRole"}]}
  inlinePolicies:
    perms: |
      {"Version": "2012-10-17", "Statement": [{"Effect": "Allow", "Action": ["s3:GetObject",]}]}
